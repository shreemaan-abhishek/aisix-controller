# OpenAI-compatible upstream that echoes what the gateway sent it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-openai
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            self._send(200, {"ok": True})

        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            req = json.loads(self.rfile.read(length) or b"{}")
            model = req.get("model", "")
            auth = self.headers.get("Authorization", "")
            self._send(200, {
                "id": "chatcmpl-e2e",
                "object": "chat.completion",
                "created": 0,
                "model": model,
                "choices": [{
                    "index": 0,
                    "message": {"role": "assistant", "content": f"upstream-model={model} auth={auth}"},
                    "finish_reason": "stop",
                }],
                "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2},
            })

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openai
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-openai}
  template:
    metadata:
      labels: {app: mock-openai}
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: ["python", "-u", "/app/server.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: mock-openai}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
spec:
  selector: {app: mock-openai}
  ports: [{port: 8080, targetPort: 8080}]
