    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AISIX Model resource.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowed_cidrs:
                description: Client IP allowlist in CIDR notation. Empty or absent allows all clients.
                items:
                  minLength: 1
                  type: string
                type: array
              auto_prompt_caching:
                description: Automatic prompt-cache breakpoint injection for Claude models on the Anthropic API, Amazon Bedrock and Vertex AI. Omit to leave injection off.
                properties:
                  enabled:
                    description: Whether automatic prompt-cache injection is active for this model.
                    type: boolean
                  ttl:
                    description: 'Cache lifetime for injected breakpoints: `5m` (default when omitted) or `1h`. A `1h` cache write costs 2x the base input rate versus 1.25x for `5m`, so it pays off only when the cached prefix is reused across a longer session. Some Claude models on Amazon Bedrock accept only the 5-minute cache, and Bedrock rejects a request to such a model that asks for `1h`.'
                    enum:
                    - 5m
                    - 1h
                    type: string
                required:
                - enabled
                type: object
              background_model_check:
                description: Direct-model-only background health-check configuration.
                properties:
                  enabled:
                    description: Whether background health checks are enabled for this model.
                    type: boolean
                  ignore_statuses:
                    description: Upstream status codes to ignore when evaluating background check failures.
                    items:
                      maximum: 599.0
                      minimum: 100.0
                      type: integer
                    type: array
                  interval_seconds:
                    description: 'Seconds between background health checks. Minimum: 5.'
                    minimum: 5.0
                    type: integer
                  max_tokens:
                    description: Maximum completion tokens requested during each background health check.
                    minimum: 1.0
                    type: integer
                  prompt:
                    description: Prompt sent to the model during each background health check.
                    minLength: 1
                    type: string
                  stale_after_seconds:
                    description: Seconds after which the last completed background check is considered stale.
                    minimum: 1.0
                    type: integer
                  timeout_seconds:
                    description: 'Request timeout in seconds for each background health check. Minimum: 1.'
                    minimum: 1.0
                    type: integer
                required:
                - enabled
                - interval_seconds
                - max_tokens
                - prompt
                - stale_after_seconds
                - timeout_seconds
                type: object
              cooldown:
                description: 'Direct-model-only request-path cooldown configuration. Cooldown is opt-in: omit this field, or leave `enabled` unset, and the model is never taken out of rotation by request-path failures.'
                properties:
                  default_seconds:
                    description: Cooldown TTL in seconds when the upstream did not supply a `Retry-After` header or `honor_retry_after` is `false`.
                    minimum: 0.0
                    type: integer
                  enabled:
                    description: Whether cooldown is active for this model. Cooldown is off unless this is set to `true`, so a model that omits it stays in rotation regardless of upstream failures.
                    type: boolean
                  honor_retry_after:
                    description: Whether to use the upstream's `Retry-After` header as the cooldown TTL when it contains seconds.
                    type: boolean
                  max_seconds:
                    description: Upper bound on cooldown TTL when `Retry-After` is used.
                    minimum: 1.0
                    type: integer
                  trigger_on_timeout:
                    description: Whether request-path timeouts trigger cooldown.
                    type: boolean
                  trigger_on_transport:
                    description: Whether transport, decode, or stream-abort errors trigger cooldown.
                    type: boolean
                  trigger_statuses:
                    description: Status codes that trigger cooldown, covering authentication failures, rate limits, and transient server errors. Caller-side validation errors such as `400`, `403`, and `422` are excluded.
                    items:
                      maximum: 599.0
                      minimum: 100.0
                      type: integer
                    type: array
                type: object
              cost:
                description: Per-token cost for budget tracking. Omit it when cost tracking is not needed.
                properties:
                  input_per_1k:
                    description: Prompt token cost in USD per 1,000 tokens.
                    minimum: 0.0
                    type: number
                  output_per_1k:
                    description: Completion token cost in USD per 1,000 tokens.
                    minimum: 0.0
                    type: number
                required:
                - input_per_1k
                - output_per_1k
                type: object
              display_name:
                description: Operator-facing unique label. Surfaces on `/v1/models`, `req.model` on chat completions, `ApiKey.allowed_models`, and the dashboard model list. `Resource::name()` returns this. Defaults to `metadata.name`.
                minLength: 1
                type: string
              effort_mapping:
                description: |-
                  Direct-model-only mapping from a client-requested reasoning effort to the value sent upstream. After resolving the final target the gateway looks the requested effort up once — the exact entry first, then the `*` entry — and never looks the result up again. A requested value that matches neither is sent unchanged.

                  Three entries are reserved. The empty-string key matches a request that sets no effort at all, meaning the effort field is absent, `null`, or empty, and its value is added to the outbound request. The `*` key matches any other present value that has no entry of its own, and never matches a request that sets no effort. A `null` value removes the effort field from the outbound request so the provider's own default applies; mapping `*` to `null` therefore strips the effort from every request whose value has no entry of its own. The empty-string key may not be mapped to `null`, because a request that sets no effort has nothing to remove, and no entry may be mapped to an empty value.

                  On the Anthropic messages and token-counting endpoints only `output_config.effort` is read and rewritten. A `thinking` block is not an effort setting for this mapping, so a request that carries `thinking` but no `output_config.effort` sets no effort and the empty-string entry applies to it. When such a request is dispatched to a provider that does not accept the Anthropic protocol, the upstream reasoning effort is derived from the mapped `output_config.effort` when one is present and from `thinking` otherwise, except that an entry that removed the effort sends no effort at all. A request that sets `thinking.type: disabled` is never given an effort by this mapping: on the Anthropic protocol no entry writes a tier to it, though an entry that removes the effort still removes it, and on any other protocol it always sends the `none` effort.

                  Claude families that reject `output_config.effort` (Haiku 4.5, Sonnet 4.5 and earlier) are the exception on those two endpoints when the model speaks the Anthropic protocol: an effort the empty-string entry would add to a request that sets none becomes `thinking: {type: enabled, budget_tokens}` instead (minimal and low 1024, medium 2048, high 4096, xhigh 8192, max 16384). The budget stays below the request's `max_tokens`, a request on the messages endpoint without `max_tokens` is sent the budget plus 4096, and a `max_tokens` of 1024 or less gets no thinking. A request that already carries a `thinking` block is sent as written, so the empty-string entry has no effect on it for these families, and a value with no budget is not sent at all.
                properties: {}
                type: object
              embedding:
                description: Embedding-modality metadata. Present on direct Models that serve an OpenAI-compatible `/v1/embeddings` endpoint (and can be referenced by a semantic router's `embedding_model`).
                properties:
                  dimensions:
                    description: Output vector dimensionality. Used to validate vectors, key the example-vector cache, and (for endpoints that support it) request a reduced output size.
                    minimum: 1.0
                    type: integer
                  normalize:
                    description: Whether the endpoint already returns L2-normalized vectors. When `false`, the gateway normalizes before computing cosine similarity. Defaults to `true`.
                    type: boolean
                required:
                - dimensions
                type: object
              ensemble:
                description: Ensemble configuration for panel calls and judge synthesis.
                properties:
                  judge:
                    description: Direct model that combines successful panel responses.
                    properties:
                      model:
                        description: Model alias for the direct model that synthesizes panel responses. Read only when `model_id` is absent.
                        minLength: 1
                        type: string
                      synthesis_prompt:
                        description: Override for the built-in synthesis prompt template.
                        minLength: 1
                        type: string
                    type: object
                  min_responses:
                    description: Minimum successful panel responses required before judge synthesis. When omitted, the gateway requires the smaller of 2 and the panel size.
                    minimum: 1.0
                    type: integer
                  panel:
                    description: Direct models called concurrently for each ensemble request.
                    items:
                      description: One member of an ensemble panel. The member model is named either by `model` (its display name) or by `model_id` (its resource id); a member must carry at least one of the two.
                      properties:
                        model:
                          description: Model alias for a direct model that receives one panel request. Read only when `model_id` is absent.
                          minLength: 1
                          type: string
                        seed:
                          description: Sampling seed for this panel member.
                          minimum: 0.0
                          type: integer
                        temperature:
                          description: Sampling temperature for this panel member. Omit it to keep the request's temperature.
                          minimum: 0.0
                          type: number
                        weight:
                          description: Reserved for a future voting/quorum strategy. AISIX currently ignores this field.
                          minimum: 0.0
                          type: integer
                      type: object
                    minItems: 1
                    type: array
                  timeout_ms:
                    description: Per-call upstream deadline applied to each panel member and the judge. Set `0` or omit it to disable the ensemble-level deadline.
                    minimum: 0.0
                    type: integer
                required:
                - judge
                - panel
                type: object
              model_name:
                description: Upstream model identifier sent in provider requests. Routing and ensemble models leave this field unset.
                minLength: 1
                type: string
              pricing_key:
                description: Name of a shared `pricing` document to take the per-token cost from, instead of setting `cost` on this model. The environment's own pricing documents are searched first and the shared catalog second; when the key matches neither, `cost` applies. Editing the pricing document repricies every model naming it, with no change to the models themselves.
                maxLength: 255
                minLength: 1
                type: string
              provider:
                description: Upstream vendor identity used for dispatch, compatibility checks, telemetry, and access logs. Routing and ensemble models leave this field unset.
                maxLength: 64
                minLength: 1
                pattern: ^[a-z0-9][a-z0-9._-]*$
                type: string
              provider_key_ref:
                description: ProviderKey, in the same namespace, this model authenticates with. Direct models need it; routing, ensemble and semantic models leave it unset.
                properties:
                  name:
                    description: ProviderKey `metadata.name`.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              rate_limit:
                description: Request, token, and concurrency limits for this model.
                properties:
                  concurrency:
                    description: Max concurrent in-flight requests.
                    minimum: 0.0
                    type: integer
                  rpd:
                    description: Requests per 86,400-second window.
                    minimum: 0.0
                    type: integer
                  rph:
                    description: Requests per 3,600-second window. There is no per-hour token limit field.
                    minimum: 0.0
                    type: integer
                  rpm:
                    description: Requests per 60-second window.
                    minimum: 0.0
                    type: integer
                  rps:
                    description: Requests per 1-second window. There is no per-second token limit field.
                    minimum: 0.0
                    type: integer
                  tpd:
                    description: Tokens per 86,400-second window.
                    minimum: 0.0
                    type: integer
                  tpm:
                    description: Tokens per 60-second window.
                    minimum: 0.0
                    type: integer
                type: object
              retries:
                description: Retry attempts against this model after a retryable upstream failure, before the request gives up (or, inside a model group, fails over to the next target). Absent falls back to the group's `routing.retries`, then to the deployment-wide `upstream.retries` default.
                minimum: 0.0
                type: integer
              routing:
                description: Virtual routing configuration. When set, the gateway selects a target from `routing.targets` and uses that target model's `provider`, `model_name`, and `provider_key_id` fields for upstream dispatch.
                properties:
                  fallback_on_statuses:
                    description: Additional upstream HTTP status codes that participate in retries and failover. By default a non-429 4xx response is treated as a caller error and returned as-is; providers that use 4xx codes for transient conditions (model overload, queue full, quota exhaustion) can be listed here, for example `[408, 409]`. 5xx codes are already retryable, so listing them changes nothing. Authentication (`401`/`403`) and validation (`400`) codes should only be listed when the provider is known to use them for transient failures.
                    items:
                      maximum: 599.0
                      minimum: 400.0
                      type: integer
                    type: array
                  hash_on:
                    description: 'Where the `consistent_hash` hash key comes from: an ordered chain of sources, the first non-empty value winning. Defaults to the `x-aisix-routing-key` request header, falling back to the caller''s API key id. Only valid with `strategy: consistent_hash`.'
                    items:
                      description: One source for the `consistent_hash` hash key. Sources are tried in order; the first one that yields a non-empty value wins.
                      properties:
                        name:
                          description: The header or cookie name to read. Required for `header` and `cookie` sources; not accepted for `api_key` or `client_ip`.
                          minLength: 1
                          type: string
                        type:
                          description: Which request attribute supplies the hash key.
                          enum:
                          - header
                          - cookie
                          - api_key
                          - client_ip
                          type: string
                      required:
                      - type
                      type: object
                    minItems: 1
                    type: array
                  max_fallbacks:
                    description: Max number of later targets to attempt after the initial target fails permanently. When omitted, all later targets may be attempted.
                    minimum: 0.0
                    type: integer
                  retries:
                    description: Retry attempts on the current target before failing over, applied to every target that does not set its own `retries`. Absent falls back to the deployment-wide `upstream.retries` default.
                    minimum: 0.0
                    type: integer
                  retry_on_429:
                    description: Whether upstream 429 participates in retries and failover.
                    type: boolean
                  strategy:
                    description: Strategy used to select a target for each request.
                    enum:
                    - round_robin
                    - consistent_hash
                    - failover
                    - least_cost
                    - least_latency
                    - least_busy
                    type: string
                  targets:
                    description: Ordered set of direct models available to this routing model.
                    items:
                      description: One destination in a routing configuration. The target model is named either by `model` (its display name) or by `model_id` (its resource id); a target must carry at least one of the two.
                      properties:
                        model:
                          description: |-
                            Model alias for a direct model that can receive routed traffic. Read only when `model_id` is absent.

                            Defaulted at the type level and required by the schemas instead — as one half of a "`model` or `model_id`" alternative, so a target naming its model by id alone validates while one naming it neither way is still rejected.
                          minLength: 1
                          type: string
                        priority:
                          description: Priority tier, default `0`; a higher value is preferred (the APISIX node-priority convention — give backup targets `-1`). The strategy orders targets within each tier; a lower tier is only tried when every higher-tier target failed or is unavailable.
                          type: integer
                        tags:
                          description: Tags for tag/metadata-conditional routing. When a request carries routing tags, only targets whose tags intersect the request's are eligible; a target tagged `"default"` is the fallback used when nothing matches and for untagged requests. Absent/empty means the target opts out of tag filtering (eligible only via the default fallback once any sibling target is tagged). The configured strategy then orders whatever set survives.
                          items:
                            minLength: 1
                            type: string
                          type: array
                        weight:
                          description: Target weight, default `1`. Used by `round_robin` (rotation share), `consistent_hash` (share of the hash ring), and `least_busy` (in-flight divided by weight). `failover`, `least_cost`, and `least_latency` accept the field but do not use it.
                          minimum: 0.0
                          type: integer
                      type: object
                    minItems: 1
                    type: array
                  when_all_unavailable:
                    description: Policy to apply when every target is unavailable because of runtime health or cooldown state.
                    enum:
                    - fail
                    - try_anyway
                    type: string
                required:
                - targets
                type: object
              semantic:
                description: Semantic-routing configuration. When set, the gateway embeds the request and dispatches to the route whose examples it matches best, using that route's target Model for upstream dispatch.
                properties:
                  classifier:
                    description: Route selection by a hosted decision model instead of embeddings. When set, `embedding_model`, `embedding_model_id`, `embedding_timeout_ms`, `on_embedding_failure` and `match` are not accepted, every route needs a `description` and takes no `examples` or `threshold`. When omitted, routes are matched by embedding similarity.
                    properties:
                      min_confidence:
                        description: Lowest confidence at which the picked route is used. A decision below it sends the request to `default`.
                        maximum: 1.0
                        minimum: 0.0
                        type: number
                      model:
                        description: Decision model to call.
                        minLength: 1
                        type: string
                      on_failure:
                        description: Behavior when the decision call fails, times out, or returns an answer that names no route. Same values as `on_embedding_failure`.
                        x-kubernetes-preserve-unknown-fields: true
                      timeout_ms:
                        description: Deadline for the decision call, in milliseconds.
                        minimum: 1.0
                        type: integer
                      type:
                        description: Decision model family. `jev` is the only supported value.
                        enum:
                        - jev
                        type: string
                    required:
                    - type
                    type: object
                  default:
                    description: Direct model alias used when no route clears its threshold. Read only when `default_id` is absent.
                    minLength: 1
                    type: string
                  embedding_model:
                    description: Alias of an `embedding`-modality Model used to embed the request and, lazily on the first request that needs them, the route examples. Read only when `embedding_model_id` is absent. Required, under this name or as `embedding_model_id`, when there is no `classifier`.
                    minLength: 1
                    type: string
                  embedding_timeout_ms:
                    description: Per-call deadline for the embedding request in milliseconds. `0` or absent disables the embedding-specific deadline.
                    minimum: 0.0
                    type: integer
                  match:
                    description: Shared matching parameters (metric, aggregation, default threshold). Required when there is no `classifier`.
                    properties:
                      aggregation:
                        description: 'Per-example score aggregation. v1: max.'
                        enum:
                        - max
                        type: string
                      distance_metric:
                        description: 'Similarity metric. v1: cosine.'
                        enum:
                        - cosine
                        type: string
                      threshold:
                        description: Default similarity threshold for routes that do not set their own `threshold`. Higher is stricter.
                        maximum: 1.0
                        minimum: 0.0
                        type: number
                    required:
                    - threshold
                    type: object
                  on_embedding_failure:
                    description: Behavior when the embedding call fails or times out. Defaults to routing to `default`.
                    x-kubernetes-preserve-unknown-fields: true
                  routes:
                    description: Routes evaluated for each request. At least one is required.
                    items:
                      description: 'One semantic route: a labeled set of example utterances whose embeddings define the route. A request that scores high enough against them dispatches to `target`.'
                      properties:
                        description:
                          description: 'What requests this route handles. With a `classifier`, this is the text the decision model reads to pick the route, and it is required. Without one, it is documentation only: routes are matched on `examples`.'
                          minLength: 1
                          type: string
                        examples:
                          description: Example utterances that define this route. AISIX caches their vectors lazily. A cold route request passes its prompt and every distinct uncached example text as one logical embedding batch. Providers without batch support may issue multiple upstream calls (Bedrock Titan does). Required, with at least one example, when the router has no `classifier`; not accepted when it has one.
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                        name:
                          description: Operator-facing route label. Surfaced in access logs (e.g. `prod-chat -> route:legal`), and in the `x-aisix-route` response header only when `proxy.expose_debug_headers` is enabled.
                          minLength: 1
                          type: string
                        target:
                          description: Direct model alias that receives traffic matching this route. Read only when `target_id` is absent.
                          minLength: 1
                          type: string
                        threshold:
                          description: Per-route similarity threshold. A request matches this route only when its aggregated score is `>=` this value. When omitted, the router-level threshold applies. Not accepted with a `classifier`.
                          maximum: 1.0
                          minimum: 0.0
                          type: number
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                required:
                - routes
                type: object
              stream_timeout:
                description: Maximum gap in milliseconds between upstream streaming chunks. `0` or absent falls back to the group's `stream_timeout`, then to the model's (or group's) `timeout`, then to the deployment-wide `upstream.stream_timeout_ms` / `timeout_ms` defaults.
                minimum: 0.0
                type: integer
              timeout:
                description: End-to-end timeout in milliseconds for non-streaming upstream calls. Absent falls back to the group's `timeout`, then to the deployment-wide `upstream.timeout_ms` default. `0` disables the non-streaming timeout for this model.
                minimum: 0.0
                type: integer
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - type
                  - status
                  - lastTransitionTime
                  - reason
                  - message
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
