apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisix-controller
  labels:
    app.kubernetes.io/name: aisix-controller
spec:
  # One writer per gateway; no leader election in v0.1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aisix-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aisix-controller
    spec:
      serviceAccountName: aisix-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: aisix-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --secret-name=aisix-resources
            - --deployment-name=aisix
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info,kube=warn
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
