[package]
name = "aisix-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Kubernetes controller that reconciles AISIX custom resources into an AISIX gateway"
publish = false

[dependencies]
# The gateway's own types, schemas and resources-file pipeline. Bump the tag
# together with AISIX_VERSION in the Makefile and the e2e chart version.
aisix-core = { git = "https://github.com/api7/aisix", tag = "v1.9.0" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", default-features = false, features = ["client", "config", "runtime", "derive", "rustls-tls", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
strip = true
